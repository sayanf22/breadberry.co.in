<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Logo Preview</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f0e8; padding: 40px; }
  h1 { color: #1a2b4b; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card-label { font-size: 11px; font-weight: 600; color: #666; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .logo-wrap { display: flex; align-items: center; justify-content: center; min-height: 64px; color: #1a2b4b; }
  svg { max-width: 100%; height: 56px; width: auto; }
</style>
</head>
<body>
<h1>Brand Logo Preview — Breadberry Client Strip</h1>
<div class="grid">

  <!-- 1. TAJ HOTELS -->
  <div class="card">
    <div class="card-label">1. Taj Hotels</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 280 60" fill="currentColor" aria-label="Taj Hotels">
        <g transform="translate(14,30)">
          <polygon points="0,-18  10,-2  0,2" />
          <polygon points="0,-18 -10,-2  0,2" />
          <polygon points="0,18  10,2   0,-2" />
          <polygon points="0,18 -10,2   0,-2" />
          <polygon points="-18,0  -2,-10  2,0" />
          <polygon points="-18,0  -2,10   2,0" />
          <polygon points=" 18,0   2,-10 -2,0" />
          <polygon points=" 18,0   2,10  -2,0" />
        </g>
        <text x="44" y="34" font-family="Georgia, serif" font-size="26" font-weight="bold" letter-spacing="6">TAJ</text>
        <text x="44" y="48" font-family="Arial Narrow, Arial, sans-serif" font-size="7" font-weight="400" letter-spacing="2.5">HOTELS · PALACES · RESORTS · SAFARIS</text>
      </svg>
    </div>
  </div>

  <!-- 2. THEOBROMA -->
  <div class="card">
    <div class="card-label">2. Theobroma</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 310 56" fill="currentColor" aria-label="Theobroma">
        <text x="10" y="36" font-family="Georgia, serif" font-size="30" font-style="italic" font-weight="400" letter-spacing="0.5">theobroma</text>
        <text x="14" y="50" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="5">PATISSERIE</text>
      </svg>
    </div>
  </div>

  <!-- 3. JW MARRIOTT -->
  <div class="card">
    <div class="card-label">3. JW Marriott</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 300 60" fill="currentColor" aria-label="JW Marriott">
        <g transform="translate(8,6) scale(0.9)">
          <path d="M 20,42 C 8,42 4,32 4,24 C 4,14 12,8 20,8 C 24,8 28,10 30,13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M 20,15 L 38,6 L 36,18 L 28,16 Z" />
          <path d="M 22,22 L 40,18 L 36,28 L 26,26 Z" />
          <path d="M 20,8 C 18,4 22,2 24,4 L 22,9 Z" />
          <path d="M 20,38 L 14,50 M 20,38 L 8,48" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <text x="52" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="2">JW MARRIOTT</text>
        <text x="52" y="45" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" letter-spacing="3.5">HOTELS &amp; RESORTS</text>
      </svg>
    </div>
  </div>

  <!-- 4. BLUE TOKAI -->
  <div class="card">
    <div class="card-label">4. Blue Tokai</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 290 60" fill="currentColor" aria-label="Blue Tokai">
        <circle cx="28" cy="30" r="25" />
        <g fill="white">
          <ellipse cx="28" cy="36" rx="5" ry="8"/>
          <ellipse cx="28" cy="26" rx="2.5" ry="4"/>
          <circle cx="28" cy="22" r="3"/>
          <circle cx="14" cy="17" r="2"/>
          <circle cx="19" cy="14" r="2"/>
          <circle cx="25" cy="12" r="2"/>
          <circle cx="31" cy="12" r="2"/>
          <circle cx="37" cy="14" r="2"/>
          <circle cx="42" cy="17" r="2"/>
        </g>
        <text x="62" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1">BLUE TOKAI</text>
        <text x="62" y="44" font-family="Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.5">COFFEE ROASTERS</text>
      </svg>
    </div>
  </div>

  <!-- 5. OBEROI -->
  <div class="card">
    <div class="card-label">5. Oberoi</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 270 60" fill="currentColor" aria-label="Oberoi">
        <g transform="translate(30,30)">
          <circle cx="0" cy="0" r="7"/>
          <line x1="0" y1="-10" x2="0" y2="-20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8.66" y1="-5" x2="17.32" y2="-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8.66" y1="5" x2="17.32" y2="10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="0" y1="10" x2="0" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-8.66" y1="5" x2="-17.32" y2="10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-8.66" y1="-5" x2="-17.32" y2="-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="5" y1="-8.66" x2="10" y2="-17.32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="9.66" y1="-1" x2="19.32" y2="-2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="5" y1="8.66" x2="10" y2="17.32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-5" y1="8.66" x2="-10" y2="17.32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-5" y1="-8.66" x2="-10" y2="-17.32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-9.66" y1="-1" x2="-19.32" y2="-2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="24" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </g>
        <text x="66" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="1">Oberoi</text>
        <text x="66" y="44" font-family="Arial Narrow, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2.5">HOTELS &amp; RESORTS</text>
      </svg>
    </div>
  </div>

  <!-- 6. PAUL -->
  <div class="card">
    <div class="card-label">6. PAUL</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 270 60" fill="currentColor" aria-label="PAUL">
        <rect x="4" y="4" width="262" height="52" fill="none" stroke="currentColor" stroke-width="1.5" rx="2"/>
        <rect x="9" y="9" width="252" height="42" fill="none" stroke="currentColor" stroke-width="0.7" rx="1"/>
        <text x="135" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="8">PAUL</text>
        <text x="135" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" font-style="italic" letter-spacing="1.5">Maison de Qualité · Fondée en 1889</text>
      </svg>
    </div>
  </div>

  <!-- 7. HYATT -->
  <div class="card">
    <div class="card-label">7. Hyatt</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 230 56" fill="currentColor" aria-label="Hyatt">
        <text x="10" y="36" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4">HYATT</text>
        <path d="M 119,22 Q 127,17 135,22" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- 8. PIZZAEXPRESS -->
  <div class="card">
    <div class="card-label">8. PizzaExpress</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 280 60" fill="currentColor" aria-label="Pizza Express">
        <g transform="translate(30,30)">
          <circle cx="0" cy="0" r="26" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="0.8"/>
          <path d="M 0,-22 Q -6,-16 -4,-10 Q 0,-14 4,-10 Q 6,-16 0,-22 Z" />
          <path d="M 0,22 Q 6,16 4,10 Q 0,14 -4,10 Q -6,16 0,22 Z" />
          <path d="M -22,0 Q -16,6 -10,4 Q -14,0 -10,-4 Q -16,-6 -22,0 Z" />
          <path d="M 22,0 Q 16,-6 10,-4 Q 14,0 10,4 Q 16,6 22,0 Z" />
          <circle cx="0" cy="-12" r="2"/>
          <circle cx="0" cy="12" r="2"/>
          <circle cx="-12" cy="0" r="2"/>
          <circle cx="12" cy="0" r="2"/>
        </g>
        <text x="68" y="26" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="0.5" font-style="italic">Pizza</text>
        <text x="68" y="46" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="0.5" font-style="italic">Express</text>
      </svg>
    </div>
  </div>

  <!-- 9. FORTUNE -->
  <div class="card">
    <div class="card-label">9. Fortune Hotels</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 280 56" fill="currentColor" aria-label="Fortune Park Lakecity">
        <line x1="10" y1="14" x2="270" y2="14" stroke="currentColor" stroke-width="1"/>
        <line x1="10" y1="44" x2="270" y2="44" stroke-width="1" stroke="currentColor"/>
        <text x="140" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" font-style="italic" letter-spacing="2">Fortune</text>
        <text x="140" y="11" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="6.5" font-weight="600" letter-spacing="3">HOTELS · RESORTS · SAFARIS</text>
        <text x="140" y="52" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="6.5" font-weight="400" letter-spacing="2">AN ITC HOTELS BRAND</text>
      </svg>
    </div>
  </div>

  <!-- 10. MERWANS -->
  <div class="card">
    <div class="card-label">10. Merwans</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 270 56" fill="currentColor" aria-label="Merwans">
        <text x="10" y="34" font-family="Georgia, serif" font-size="28" font-weight="700" font-style="italic" letter-spacing="1">Merwans</text>
        <text x="12" y="49" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.5">CONFECTIONERS</text>
        <text x="192" y="49" font-family="Georgia, serif" font-size="7.5" font-style="italic" letter-spacing="0.5">Est. 1930</text>
      </svg>
    </div>
  </div>

  <!-- 11. BASTIAN -->
  <div class="card">
    <div class="card-label">11. Bastian</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 260 56" fill="currentColor" aria-label="Bastian">
        <line x1="10" y1="16" x2="250" y2="16" stroke="currentColor" stroke-width="0.8"/>
        <text x="130" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="10">BASTIAN</text>
        <line x1="10" y1="42" x2="250" y2="42" stroke="currentColor" stroke-width="0.8"/>
        <text x="130" y="52" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="7" font-weight="400" letter-spacing="3">MUMBAI</text>
      </svg>
    </div>
  </div>

  <!-- 12. PARSI DAIRY -->
  <div class="card">
    <div class="card-label">12. Parsi Dairy Farm</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 280 56" fill="currentColor" aria-label="Parsi Dairy Farm">
        <path d="M 24,10 C 24,10 16,20 16,28 C 16,34 19.5,38 24,38 C 28.5,38 32,34 32,28 C 32,20 24,10 24,10 Z"/>
        <text x="44" y="24" font-family="Arial Black, Arial Bold, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1">PARSI DAIRY</text>
        <text x="44" y="41" font-family="Arial Black, Arial Bold, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1">FARM</text>
        <text x="44" y="52" font-family="Arial, sans-serif" font-size="7" font-weight="400" letter-spacing="1.5">ESTABLISHED 1916</text>
      </svg>
    </div>
  </div>

  <!-- 13. OLIVE -->
  <div class="card">
    <div class="card-label">13. Olive Bar & Kitchen</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 240 56" fill="currentColor" aria-label="Olive Bar and Cafe">
        <text x="10" y="34" font-family="Gill Sans, Optima, Futura, Trebuchet MS, sans-serif" font-size="28" font-weight="300" letter-spacing="4">olive</text>
        <text x="12" y="48" font-family="Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="4">BAR &amp; KITCHEN</text>
      </svg>
    </div>
  </div>

  <!-- 14. MILKY MIST -->
  <div class="card">
    <div class="card-label">14. Milky Mist</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 240 56" fill="currentColor" aria-label="Milky Mist">
        <path d="M 18,8 C 18,8 10,18 10,26 C 10,31.5 13.5,35 18,35 C 22.5,35 26,31.5 26,26 C 26,18 18,8 18,8 Z"/>
        <text x="36" y="30" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">Milky Mist</text>
        <text x="36" y="44" font-family="Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="2">DAIRY PRODUCTS</text>
      </svg>
    </div>
  </div>

  <!-- 15. MAINLAND CHINA -->
  <div class="card">
    <div class="card-label">15. Mainland China</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 290 56" fill="currentColor" aria-label="Mainland China">
        <line x1="10" y1="12" x2="280" y2="12" stroke="currentColor" stroke-width="1.5"/>
        <line x1="10" y1="14.5" x2="280" y2="14.5" stroke="currentColor" stroke-width="0.5"/>
        <text x="10" y="33" font-family="Georgia, serif" font-size="19" font-weight="600" letter-spacing="1">Mainland China</text>
        <line x1="10" y1="40" x2="280" y2="40" stroke="currentColor" stroke-width="0.5"/>
        <line x1="10" y1="42.5" x2="280" y2="42.5" stroke="currentColor" stroke-width="1.5"/>
        <text x="10" y="52" font-family="Arial Narrow, sans-serif" font-size="8" font-weight="400" letter-spacing="2.5">FINE CHINESE DINING</text>
      </svg>
    </div>
  </div>

  <!-- 16. MAPRO -->
  <div class="card">
    <div class="card-label">16. Mapro</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 200 56" fill="currentColor" aria-label="Mapro">
        <text x="10" y="38" font-family="Arial Black, Impact, sans-serif" font-size="32" font-weight="900" letter-spacing="1">mapro</text>
        <text x="12" y="50" font-family="Arial, sans-serif" font-size="7.5" font-weight="500" letter-spacing="2">FOODS</text>
      </svg>
    </div>
  </div>

  <!-- 17. MIZU -->
  <div class="card">
    <div class="card-label">17. Mizu</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 200 56" fill="currentColor" aria-label="Mizu">
        <path d="M 10,24 Q 22,14 34,24 Q 46,34 58,24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 10,30 Q 22,20 34,30 Q 46,40 58,30" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
        <text x="68" y="36" font-family="Arial, sans-serif" font-size="26" font-weight="300" letter-spacing="6">MIZU</text>
        <text x="68" y="49" font-family="Arial, sans-serif" font-size="7" font-weight="400" letter-spacing="3">IZAKAYA</text>
      </svg>
    </div>
  </div>

  <!-- 18. EVE -->
  <div class="card">
    <div class="card-label">18. EVE</div>
    <div class="logo-wrap">
      <svg viewBox="0 0 180 56" fill="currentColor" aria-label="EVE">
        <line x1="14" y1="12" x2="166" y2="12" stroke="currentColor" stroke-width="0.8"/>
        <text x="90" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="400" letter-spacing="10">EVE</text>
